name: release
# Builds the closed-beta app: a signed Android bundle for Play internal testing and an iOS archive for TestFlight.
# Run by hand (Actions, release, Run workflow) or by pushing a tag like v1.0.0. Not tried yet: the secrets below
# must exist first (docs/release/checklist.md lists how to get each one).
#
# Repository secrets
#   APP_ENV_JSON                  the release app settings as one JSON object (FLAVOR, SUPABASE_URL, SUPABASE_ANON_KEY,
#                                 MAP_TILE_URL, GOOGLE_WEB_CLIENT_ID, GOOGLE_IOS_CLIENT_ID), same keys as app/env/staging.json
#   ANDROID_KEYSTORE_BASE64       the upload keystore, base64
#   ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_PASSWORD, ANDROID_KEY_ALIAS
#   PLAY_SERVICE_ACCOUNT_JSON     Google Play API service account, for the internal-testing upload
#   IOS_CERT_P12_BASE64, IOS_CERT_PASSWORD   Apple distribution certificate
#   IOS_PROFILE_BASE64            App Store provisioning profile for com.jom.jom
#   APPSTORE_ISSUER_ID, APPSTORE_KEY_ID, APPSTORE_PRIVATE_KEY   App Store Connect API key, for the TestFlight upload
on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Signing key and app settings
        env:
          ENV_JSON: ${{ secrets.APP_ENV_JSON }}
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          printf '%s' "$ENV_JSON" > env/release.json
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/upload.jks"
          printf 'storeFile=%s\nstorePassword=%s\nkeyPassword=%s\nkeyAlias=%s\n' \
            "$RUNNER_TEMP/upload.jks" "$STORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" > android/key.properties
      - run: flutter pub get
      - run: flutter build appbundle --release --dart-define-from-file=env/release.json --build-number=${{ github.run_number }}
      - name: The bundle is signed with the upload key, not the debug key
        run: |
          keytool -printcert -jarfile build/app/outputs/bundle/release/app-release.aab | tee "$RUNNER_TEMP/cert.txt"
          ! grep -qi 'Android Debug' "$RUNNER_TEMP/cert.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: app-release.aab
          path: app/build/app/outputs/bundle/release/app-release.aab
      - uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.jom.jom
          releaseFiles: app/build/app/outputs/bundle/release/app-release.aab
          track: internal
          status: draft

  ios:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Certificate, profile and app settings
        env:
          ENV_JSON: ${{ secrets.APP_ENV_JSON }}
          CERT: ${{ secrets.IOS_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.IOS_CERT_PASSWORD }}
          PROFILE: ${{ secrets.IOS_PROFILE_BASE64 }}
        run: |
          printf '%s' "$ENV_JSON" > env/release.json
          KC="$RUNNER_TEMP/build.keychain"
          security create-keychain -p "" "$KC"
          security set-keychain-settings "$KC"
          security unlock-keychain -p "" "$KC"
          echo "$CERT" | base64 -d > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "" "$KC"
          security list-keychains -d user -s "$KC" login.keychain
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$PROFILE" | base64 -d > ~/Library/MobileDevice/Provisioning\ Profiles/jom.mobileprovision
          UUID=$(security cms -D -i ~/Library/MobileDevice/Provisioning\ Profiles/jom.mobileprovision | plutil -extract UUID raw -)
          cat > "$RUNNER_TEMP/export.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>signingStyle</key><string>manual</string>
            <key>provisioningProfiles</key><dict><key>com.jom.jom</key><string>$UUID</string></dict>
          </dict></plist>
          PLIST
      - run: flutter pub get
      - run: flutter build ipa --release --dart-define-from-file=env/release.json --build-number=${{ github.run_number }} --export-options-plist="$RUNNER_TEMP/export.plist"
      - name: Find the archive (its file name follows the app's product name)
        id: ipa
        run: echo "path=$(ls build/ios/ipa/*.ipa | head -1)" >> "$GITHUB_OUTPUT"
      - uses: apple-actions/upload-testflight-build@v1
        with:
          app-path: app/${{ steps.ipa.outputs.path }}
          issuer-id: ${{ secrets.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ secrets.APPSTORE_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_PRIVATE_KEY }}
