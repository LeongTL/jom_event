name: deploy-staging

# Puts what is on main onto the hosted staging project, but only after ci passed on that same commit.
# Needs the repository variable STAGING_DEPLOY_ENABLED=true and these repository secrets
# (Settings > Secrets and variables > Actions):
#   SUPABASE_ACCESS_TOKEN   a personal access token from supabase.com/dashboard/account/tokens
#   STAGING_PROJECT_REF     the staging project's reference (habundtbjgzkidwcaogw)
#   STAGING_ANON_KEY        the staging project's public (anon) key, for the smoke test
# No database password is needed: with the access token the CLI logs in to the database itself.
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency: deploy-staging

jobs:
  deploy:
    # Off until the repository variable STAGING_DEPLOY_ENABLED is set to true (after the secrets below exist).
    if: ${{ vars.STAGING_DEPLOY_ENABLED == 'true' && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success') }}
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase link --project-ref "${{ secrets.STAGING_PROJECT_REF }}"
      - run: supabase db push
      - run: supabase functions deploy --project-ref "${{ secrets.STAGING_PROJECT_REF }}"
      - name: Smoke test the deployed backend
        env:
          SUPABASE_URL: https://${{ secrets.STAGING_PROJECT_REF }}.supabase.co
          SUPABASE_ANON_KEY: ${{ secrets.STAGING_ANON_KEY }}
        run: tools/staging_smoke.sh
