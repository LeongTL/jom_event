name: e2e
# The six end-to-end journeys (app/integration_test) on an Android emulator, against a local Supabase with the mock gateway.
on:
  pull_request:
    paths: ['app/**', 'supabase/**', 'tools/e2e*', '.github/workflows/e2e.yml']
  workflow_dispatch:

jobs:
  journeys:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase start
      - name: Serve the edge functions (the mock payment gateway)
        run: |
          printf 'FLAVOR=dev\nGATEWAY_WEBHOOK_SECRET=ci-secret\n' > "$RUNNER_TEMP/fn.env"
          supabase functions serve --no-verify-jwt --env-file "$RUNNER_TEMP/fn.env" > "$RUNNER_TEMP/fn.log" 2>&1 &
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Let the emulator use hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          script: |
            cd app && flutter pub get && flutter build apk --debug && flutter install -d emulator-5554 && cd ..
            adb shell pm grant com.jom.jom android.permission.ACCESS_FINE_LOCATION
            adb shell pm grant com.jom.jom android.permission.ACCESS_COARSE_LOCATION
            E2E_API_HOST=10.0.2.2 tools/e2e.sh emulator-5554
      - name: Edge function log
        if: failure()
        run: cat "$RUNNER_TEMP/fn.log" || true
