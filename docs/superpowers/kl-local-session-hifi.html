<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KL Local Session Hi-fi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#0b0b10;color:#e9e9f2;font:15px/1.45 Inter,-apple-system,system-ui,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:12px 10px}
.cap{display:flex;gap:10px;align-items:center;margin-bottom:10px;font-size:12px;color:#9a9ab0;flex-wrap:wrap;justify-content:center}
.cap b{color:#fff;font:800 15px "Bricolage Grotesque",Inter,sans-serif}
select{background:#1b1b24;color:#fff;border:1px solid #333;border-radius:10px;padding:6px 8px;font:inherit}
#wrap{position:relative}
.phone{width:390px;height:844px;border-radius:46px;position:absolute;left:0;top:0;transform-origin:0 0;overflow:hidden;box-shadow:0 0 0 8px #1b1b24,0 30px 80px rgba(0,0,0,.6);background:var(--sheet);color:var(--sheetink);transition:background .5s,color .5s}
.phone[data-t=now]{--p1:#ffb88c;--p2:#ff7aa8;--p3:#8b5cf6;--p4:#ffd166;--ink:#fff;--sub:rgba(255,255,255,.75);--glass:rgba(255,255,255,.16);--glassb:rgba(255,255,255,.28);--acc:#ffd166;--accink:#2a1450;--sheet:#17102e;--sheetink:#f3eefc;--card:rgba(255,255,255,.08);--line:rgba(255,255,255,.12)}
.phone[data-t=late]{--p1:#7f8cff;--p2:#b07bff;--p3:#2f2a78;--p4:#4a5fd6;--ink:#fff;--sub:rgba(255,255,255,.72);--glass:rgba(255,255,255,.12);--glassb:rgba(255,255,255,.22);--acc:#9db0ff;--accink:#0b1030;--sheet:#0c0e22;--sheetink:#eef0ff;--card:rgba(255,255,255,.07);--line:rgba(255,255,255,.1)}
.phone[data-t=sat]{--p1:#7fd0ff;--p2:#ffe08a;--p3:#a8ecc8;--p4:#6aa8ff;--ink:#0d2038;--sub:rgba(13,32,56,.7);--glass:rgba(255,255,255,.5);--glassb:rgba(255,255,255,.8);--acc:#0d2038;--accink:#fff;--sheet:#fff;--sheetink:#14213a;--card:#f1f6fb;--line:rgba(20,33,58,.1)}
.phone[data-t=later]{--ink:#fff;--sub:rgba(255,255,255,.75);--glass:rgba(255,255,255,.14);--glassb:rgba(255,255,255,.26);--acc:#8ff0c0;--accink:#06241c;--sheet:#0e2230;--sheetink:#e9f6f6;--card:rgba(255,255,255,.07);--line:rgba(255,255,255,.12)}
.phone[data-t=sun]{--ink:#3a1030;--sub:rgba(58,16,48,.72);--glass:rgba(255,255,255,.45);--glassb:rgba(255,255,255,.75);--acc:#3a1030;--accink:#ffe6d6;--sheet:#fff8f4;--sheetink:#3a1030;--card:#fdeee6;--line:rgba(58,16,48,.1)}
.phone.home{color:var(--ink)}
.skyL,.skystars,.orb{opacity:0;pointer-events:none}
.skyL{position:absolute;inset:0;transition:opacity .7s}
.phone.home[data-t=now] .skyL[data-s=now],.phone.home[data-t=late] .skyL[data-s=late],.phone.home[data-t=sat] .skyL[data-s=sat],.phone.home[data-t=sun] .skyL[data-s=sun],.phone.home[data-t=later] .skyL[data-s=later]{opacity:1}
.skyL[data-s=now]{background:linear-gradient(180deg,#1a0f3d 0%,#4a1f7a 34%,#d4467c 68%,#ff9a62 100%)}
.skyL[data-s=late]{background:linear-gradient(180deg,#050816 0%,#0f1538 45%,#2a1f5c 100%)}
.skyL[data-s=sat]{background:linear-gradient(180deg,#59b8ff 0%,#9be0ff 45%,#fff0c9 100%)}
.skyL[data-s=later]{background:linear-gradient(180deg,#0b2a3a 0%,#1c5d73 40%,#52b6a6 76%,#d8f3c4 100%)}
.skyL[data-s=sun]{background:linear-gradient(180deg,#ffb68a 0%,#ff9fb2 45%,#b9a6ff 100%)}
.skystars{position:absolute;inset:0;transition:opacity .7s;background-image:radial-gradient(1.5px 1.5px at 30px 70px,#fff,transparent),radial-gradient(1px 1px at 90px 130px,#fff,transparent),radial-gradient(1.5px 1.5px at 160px 50px,#fff,transparent),radial-gradient(1px 1px at 230px 110px,#fff,transparent),radial-gradient(1.5px 1.5px at 300px 60px,#fff,transparent),radial-gradient(1px 1px at 350px 140px,#fff,transparent)}
.phone.home[data-t=late] .skystars{opacity:.9}.phone.home[data-t=now] .skystars{opacity:.35}
.orb{position:absolute;width:150px;height:150px;border-radius:50%;transition:all .8s cubic-bezier(.5,0,.2,1)}
.phone.home[data-t=now] .orb{left:200px;top:330px;background:radial-gradient(circle,#ffe29a 0%,#ffb35c 45%,rgba(255,150,90,0) 70%);opacity:.9}
.phone.home[data-t=late] .orb{left:250px;top:70px;width:90px;height:90px;background:radial-gradient(circle at 35% 35%,#fff 0%,#dfe3ff 55%,rgba(200,210,255,0) 72%);opacity:.95}
.phone.home[data-t=sat] .orb{left:230px;top:30px;background:radial-gradient(circle,#fffbe0 0%,#fff3a0 40%,rgba(255,243,160,0) 70%);opacity:1}
.phone.home[data-t=later] .orb{left:250px;top:330px;width:110px;height:110px;background:radial-gradient(circle,#eaffd8 0%,#9be7c4 45%,rgba(155,231,196,0) 70%);opacity:.85}
.phone.home[data-t=sun] .orb{left:30px;top:300px;background:radial-gradient(circle,#fff6e0 0%,#ffd9a8 45%,rgba(255,217,168,0) 70%);opacity:.9}
.status{position:absolute;top:0;left:0;right:0;height:40px;padding:14px 28px 0;display:flex;justify-content:space-between;font-size:12px;font-weight:600;z-index:20;pointer-events:none}
#screen{position:absolute;inset:0}
.glass{background:var(--glass);border:1px solid var(--glassb);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);color:var(--ink)}
/* shared */
.scroll{position:absolute;inset:0;overflow:auto;scrollbar-width:none;padding:0 20px 120px}.scroll::-webkit-scrollbar{display:none}
.scroll.nopad{padding:0 0 130px}
.nav{display:flex;align-items:center;gap:12px;padding:52px 0 14px}
.nav b{flex:1;font:800 20px "Bricolage Grotesque",Inter,sans-serif;letter-spacing:-.01em}
.nav.center b{text-align:center}
.rb{width:40px;height:40px;border-radius:50%;border:0;background:var(--card);color:var(--sheetink);display:grid;place-items:center;font-size:20px;cursor:pointer;flex:none}
.rb.gl{background:rgba(0,0,0,.28);color:#fff;backdrop-filter:blur(10px)}
h2{margin:6px 0 8px;font:800 28px/1.08 "Bricolage Grotesque",Inter,sans-serif;letter-spacing:-.02em}
h3{margin:0 0 4px;font:800 22px/1.1 "Bricolage Grotesque",Inter,sans-serif}
.kick{font:700 11px Inter;letter-spacing:.12em;text-transform:uppercase;opacity:.6}
.mut{opacity:.62;font-size:13px}
.btn{height:54px;border-radius:27px;border:0;font:700 16px Inter;cursor:pointer;width:100%;display:flex;align-items:center;justify-content:center;gap:8px}
.btn.pri{background:var(--acc);color:var(--accink)}
.btn.sec{background:var(--card);color:var(--sheetink)}
.btn.link{background:none;color:var(--sheetink);height:40px;font-weight:600;opacity:.7;text-decoration:underline}
.btn.sm{height:38px;width:auto;padding:0 16px;font-size:13px;border-radius:19px}
.cta{position:absolute;left:0;right:0;bottom:0;padding:26px 20px 28px;background:linear-gradient(180deg,transparent,var(--sheet) 38%);z-index:6;display:flex;gap:10px}
.cta .btn{flex:1}.cta .rb{width:54px;height:54px}
.card{background:var(--card);border-radius:22px;padding:16px;margin-bottom:12px}
.row{display:flex;gap:12px;align-items:center}
.row .sp{flex:1;min-width:0}
.av{width:44px;height:44px;border-radius:50%;background:linear-gradient(145deg,#ff9a62,#d4467c);display:grid;place-items:center;font-weight:800;color:#fff;flex:none}
.st{font:700 11px Inter;padding:4px 10px;border-radius:99px;background:var(--card);display:inline-block}
.st.ok{background:#1fbf75;color:#fff}.st.warn{background:#ffb020;color:#2a1a00}.st.bad{background:#ff5a67;color:#fff}
.seg{display:flex;background:var(--card);border-radius:22px;padding:4px;margin-bottom:16px}
.seg button{flex:1;height:36px;border:0;border-radius:18px;background:none;color:var(--sheetink);font:600 13px Inter;cursor:pointer;opacity:.7}
.seg button.on{background:var(--acc);color:var(--accink);opacity:1}
.fld{background:var(--card);border-radius:18px;padding:12px 16px;margin-bottom:10px}
.fld label{display:block;font:600 11px Inter;letter-spacing:.08em;text-transform:uppercase;opacity:.55;margin-bottom:2px}
.fld input,.fld textarea,.fld .v{width:100%;background:none;border:0;outline:0;color:var(--sheetink);font:600 16px Inter;padding:0;resize:none}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{height:36px;padding:0 14px;border-radius:18px;background:var(--card);display:inline-flex;align-items:center;gap:6px;font:600 13px Inter;cursor:pointer;white-space:nowrap;border:2px solid transparent}
.chip.on{background:var(--acc);color:var(--accink)}
.tabs{position:absolute;left:24px;right:24px;bottom:22px;height:62px;border-radius:31px;display:flex;padding:6px;z-index:8;background:var(--sheet);box-shadow:0 14px 34px rgba(0,0,0,.35);border:1px solid var(--line)}
.tabs div{flex:1;border-radius:25px;display:grid;place-items:center;color:var(--sheetink);opacity:.55;cursor:pointer;font:600 10px Inter;align-content:center;transition:all .3s}
.tabs div.on{background:var(--acc);color:var(--accink);opacity:1}
.tabs svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.5);z-index:30;display:flex;align-items:flex-end;animation:fade .25s}
.msheet{background:var(--sheet);color:var(--sheetink);width:100%;border-radius:30px 30px 0 0;padding:12px 20px 32px;animation:rise .35s cubic-bezier(.2,.8,.2,1)}
.msheet .gr{width:40px;height:5px;border-radius:3px;background:var(--line);filter:brightness(1.8);margin:0 auto 16px}
@keyframes fade{from{opacity:0}}@keyframes rise{from{transform:translateY(40px);opacity:0}}
.heroart{height:300px;position:relative;overflow:hidden}
.heroart .big{position:absolute;left:50%;top:52%;transform:translate(-50%,-50%) rotate(-8deg);font-size:150px;filter:drop-shadow(0 14px 24px rgba(0,0,0,.28))}
.heroart::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 25% 20%,rgba(255,255,255,.35),transparent 45%);z-index:1}
.heroart .rb{position:absolute;top:52px;z-index:3}
.sbody{position:relative;background:var(--sheet);border-radius:30px 30px 0 0;margin-top:-30px;padding:24px 20px 0;z-index:2}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:18px 0}
.facts div{background:var(--card);border-radius:20px;padding:12px 8px;text-align:center}
.facts i{display:block;font-style:normal;font-size:20px;margin-bottom:2px}.facts b{display:block;font-size:14px}.facts small{opacity:.6;font-size:11px}
.soft{background:var(--card);border-radius:16px;padding:12px 14px;font-size:13px;margin:12px 0}
.mini{width:56px;height:56px;border-radius:18px;display:grid;place-items:center;font-size:28px;flex:none}
.poster{position:relative;overflow:hidden;border-radius:26px;color:#fff;cursor:pointer;flex:none;animation:pop2 .45s backwards}
@keyframes pop2{from{opacity:0;transform:translateY(14px)}}
.poster .big{position:absolute;right:-6px;top:6px;font-size:92px;transform:rotate(-10deg);filter:drop-shadow(0 8px 14px rgba(0,0,0,.25))}
.poster::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 20% 15%,rgba(255,255,255,.28),transparent 45%),linear-gradient(180deg,transparent 40%,rgba(0,0,0,.55))}
.poster .tp{position:absolute;left:12px;top:12px;z-index:2}.poster .bt{position:absolute;left:12px;right:12px;bottom:12px;z-index:2}
.poster .bt b{display:block;font:800 17px/1.08 "Bricolage Grotesque",Inter,sans-serif;margin-bottom:4px}.poster .bt span{font-size:11px;opacity:.92}
.poster .price{position:absolute;right:12px;top:12px;z-index:2;font:800 12px Inter;background:#fff;color:#111;border-radius:99px;padding:4px 9px}
.poster .heart{position:absolute;right:10px;bottom:10px;z-index:3;width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.22);backdrop-filter:blur(8px);display:grid;place-items:center;border:0;color:#fff;font-size:14px;cursor:pointer}
.poster .heart.on{background:#fff;color:#ff3d6e}
.poster .tagc{letter-spacing:.02em;padding:4px 8px;font-size:9px}
.tagc{font:700 10px Inter;letter-spacing:.06em;border-radius:99px;padding:4px 9px;background:rgba(0,0,0,.4);backdrop-filter:blur(8px);display:inline-flex;gap:6px;align-items:center}
.live{width:7px;height:7px;border-radius:50%;background:#ff4d5e;display:inline-block;animation:blink 1.4s infinite}
@keyframes blink{0%{box-shadow:0 0 0 0 rgba(255,77,94,.7)}70%{box-shadow:0 0 0 7px rgba(255,77,94,0)}100%{box-shadow:0 0 0 0 rgba(255,77,94,0)}}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ring{width:130px;height:130px;border-radius:50%;display:grid;place-items:center;margin:6px auto 18px}
.ring div{width:104px;height:104px;border-radius:50%;background:var(--sheet);display:grid;place-items:center;text-align:center;font:800 28px "Bricolage Grotesque";line-height:1}
.ring small{display:block;font:500 11px Inter;opacity:.6;margin-top:4px}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:var(--acc);border-radius:4px}
.sw{width:50px;height:30px;border-radius:15px;background:var(--line);position:relative;cursor:pointer;flex:none;transition:.25s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.25s}
.swwrap.on .sw{background:var(--acc)}.swwrap.on .sw::after{left:23px}
.cond{display:none}.swwrap.on .cond{display:block}
.chk{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;cursor:pointer;color:transparent;flex:none}
.chk.on{background:#1fbf75;border-color:#1fbf75;color:#fff}
.spin{width:84px;height:84px;border-radius:50%;border:6px solid var(--line);border-top-color:var(--acc);animation:rot 1s linear infinite;margin:0 auto}
@keyframes rot{to{transform:rotate(360deg)}}
.center{text-align:center}
.pop{width:92px;height:92px;border-radius:50%;background:#1fbf75;color:#fff;display:grid;place-items:center;font-size:44px;margin:0 auto;animation:pp .6s cubic-bezier(.2,1.4,.4,1)}
@keyframes pp{from{transform:scale(0)}}
.ticket{border-radius:28px;overflow:hidden;background:var(--card);margin:14px 0}
.ticket .th{padding:18px;color:#fff;position:relative;overflow:hidden}.ticket .th .big{position:absolute;right:-6px;top:-4px;font-size:88px;transform:rotate(-10deg);opacity:.9}
.ticket .tb{padding:18px;text-align:center;border-top:2px dashed var(--line)}
.stars{font-size:38px;letter-spacing:6px;text-align:center;cursor:pointer;user-select:none}
.stars span{opacity:.25}.stars span.on{opacity:1;color:#ffb020}
/* gateway (hosted by gateway: neutral white) */
.gw{position:absolute;inset:0;background:#f6f7f9;color:#111;overflow:auto;padding-bottom:110px}
.gw .gh{background:#fff;padding:52px 20px 14px;border-bottom:1px solid #e5e7eb;display:flex;justify-content:space-between;font-weight:700}
.gw .meth{background:#fff;border:2px solid #e5e7eb;border-radius:16px;padding:14px;margin-bottom:10px;display:flex;gap:12px;align-items:center;cursor:pointer}
.gw .meth.on{border-color:#2f6bff}.gw .rad{width:20px;height:20px;border-radius:50%;border:2px solid #c3c8d1;flex:none}.gw .meth.on .rad{border:6px solid #2f6bff}
.gw .gbtn{position:absolute;left:0;right:0;bottom:0;padding:16px 20px 28px;background:#f6f7f9}
.gw .gbtn button{width:100%;height:52px;border:0;border-radius:12px;background:#2f6bff;color:#fff;font:700 16px Inter;cursor:pointer}
.dockx{position:absolute!important;left:0;right:0;top:568px;padding:20px 97px 20px!important;scroll-padding:0;z-index:4}
.dc{position:relative;transition:transform .32s cubic-bezier(.2,.9,.3,1.25),box-shadow .32s;flex:none;width:196px;height:104px;border-radius:24px;display:flex;gap:10px;align-items:center;padding:10px;scroll-snap-align:center;cursor:pointer}
.dc.mid{transform:translateY(-12px) scale(1.06);z-index:2;box-shadow:0 14px 22px -6px rgba(0,0,0,.38)}
.dc.mid+.dc,.dc:has(+.dc.mid){transform:translateX(10px) scale(.96)}
.dc:has(+.dc.mid){transform:translateX(-10px) scale(.96)}
.dc.mid+.dc+.dc{transform:translateX(4px)}
.dc:has(+.dc+.dc.mid){transform:translateX(-4px)}
.dc .da{width:64px;height:84px;border-radius:16px;display:grid;place-items:center;font-size:34px;flex:none}
.dc .di{min-width:0;flex:1}.dc .di b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font:800 14px/1.1 "Bricolage Grotesque",Inter,sans-serif}.dc .di span{display:block;font-size:10.5px;color:var(--sub);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.dc .di i{font:800 13px Inter,sans-serif;font-style:normal;margin-top:3px;display:block}
.scx{display:flex;gap:12px;overflow-x:auto;padding:4px 20px 14px;scroll-snap-type:x mandatory;scroll-padding-left:20px;scrollbar-width:none}.scx::-webkit-scrollbar{display:none}
.node.cl{background:var(--glass);border:2px dashed var(--ink);color:var(--ink);backdrop-filter:blur(8px);font:800 17px Inter,sans-serif}
.node.cl small{position:absolute;top:100%;left:50%;transform:translateX(-50%);font:600 9px Inter;white-space:nowrap;margin-top:3px;color:var(--ink)}
.zchip{position:absolute;left:0;top:-2px;z-index:6;border-radius:99px;padding:6px 12px;font:700 12px Inter;cursor:pointer}
.tick{position:absolute;font:600 9px Inter;color:var(--sub);transform:translate(-50%,-50%);white-space:nowrap}
/* home */
.hhead{position:absolute;top:44px;left:20px;right:20px;display:flex;justify-content:space-between;align-items:center;z-index:3}
.pill{font:600 13px Inter;border-radius:99px;padding:8px 13px;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.hero{position:absolute;top:100px;left:20px;right:20px;z-index:3}
.eyebrow{font:600 11px Inter;letter-spacing:.14em;color:var(--sub)}
.hero h1{margin:6px 0 6px;font:800 30px/1.05 "Bricolage Grotesque",Inter,sans-serif;letter-spacing:-.02em}
.hero h1 em{font-style:normal;background:var(--acc);color:var(--accink);padding:0 10px;border-radius:14px;display:inline-block;transform:rotate(-3deg);margin-right:2px}
.hero .sub{font-size:13px;color:var(--sub)}
.radar{position:absolute;top:226px;left:20px;width:350px;height:214px}
.rg{position:absolute;left:175px;top:var(--cy,112px);border-radius:50%;border:1px solid var(--glassb);transform:translate(-50%,-50%)}
.rg.a{width:114px;height:calc(76px*var(--ky,1))}.rg.b{width:210px;height:calc(140px*var(--ky,1))}.rg.c{width:306px;height:calc(204px*var(--ky,1))}
.pulse{position:absolute;left:175px;top:var(--cy,112px);width:30px;height:30px;border-radius:50%;border:2px solid var(--ink);opacity:0;animation:out 3s ease-out infinite;transform:translate(-50%,-50%)}.pulse.p2{animation-delay:1.5s}
@keyframes out{0%{opacity:.6;transform:translate(-50%,-50%) scale(.6)}100%{opacity:0;transform:translate(-50%,-50%) scale(7)}}
.you{position:absolute;left:175px;top:var(--cy,112px);width:14px;height:14px;border-radius:50%;background:var(--ink);transform:translate(-50%,-50%);box-shadow:0 0 0 5px var(--glass),0 0 22px var(--ink)}
.node{position:absolute;width:46px;height:46px;border-radius:50%;transform:translate(-50%,-50%);display:grid;place-items:center;font-size:24px;border:3px solid #fff;box-shadow:0 6px 16px rgba(0,0,0,.35);cursor:pointer;transition:transform .25s,opacity .3s;animation:popn .5s backwards}
.node:hover,.node.sel{transform:translate(-50%,-50%) scale(1.25);z-index:3}
.node.sel{z-index:4;box-shadow:0 0 0 5px rgba(255,255,255,.45),0 0 26px rgba(255,255,255,.7),0 10px 24px rgba(0,0,0,.4)}
.node.sel::after{content:"";position:absolute;inset:-5px;border-radius:50%;border:2px solid rgba(255,255,255,.8);animation:out2 1.8s ease-out infinite}
@keyframes out2{0%{transform:scale(.9);opacity:.9}100%{transform:scale(1.5);opacity:0}}
@keyframes popn{from{transform:translate(-50%,-50%) scale(0)}}
.node.dim{opacity:.18;pointer-events:none}
.dial{position:absolute;bottom:96px;left:24px;right:24px;height:44px;border-radius:22px;display:grid;grid-template-columns:repeat(4,1fr);padding:4px;z-index:7}

<div class="cta"><div class="msgbar" style="flex:1"><div class="fld"><input placeholder="Message ${host?'Aina':e.host}…"></div><button class="rb" style="background:var(--acc);color:var(--accink);width:48px;height:48px">↑</button></div></div>`};
S.chats={tab:'att',html(){return `<div class="scroll">${nav('Chat').replace(back(),'')}<div class="mut" style="margin:-4px 4px 14px">Ask a host before you book.</div>
${chatRow(PIL.g,art(PIL),'Mei Studio','Yes, mats are provided 🙂 Just wear…','9:24 AM',1,'chat')}
${chatRow(DATA.sun.ev[2].g,art(DATA.sun.ev[2]),'Clay & Co','Starts 2 PM sharp, see you there!','Yesterday',0,'chat')}
${chatRow(DATA.now.ev[3].g,art(DATA.now.ev[3]),'Salsa KL','Thanks for coming last week!','Fri',0,'chat')}</div>`}};
S.chat={html(){return thread(false)}};
S.hchats={tab:'host',html(){return `<div class="scroll">${nav('Chat').replace(back(),'')}<div class="mut" style="margin:-4px 4px 14px">Messages from guests about your events.</div>
${chatRow('A',"linear-gradient(145deg,#ff9a62,#d4467c)",'Aina Rahman','Do I need to bring my own mat? · Beginner Mat Pilates','9:21 AM',1,'hchat')}
${chatRow('D',"linear-gradient(145deg,#4facfe,#00c6a7)",'Daniel Tan','Is there parking nearby? · Beginner Mat Pilates','8:05 AM',1,'hchat')}
${chatRow('S',"linear-gradient(145deg,#f093fb,#f5576c)",'Sarah Lim','See you on Sunday! · Batik Painting Workshop','Yesterday',0,'hchat')}</div>`}};
S.hchat={html(){return thread(true)}};
S.hprofile={tab:'host',html(){return `<div class="scroll">${nav('Profile').replace(back(),'')}<div class="center" style="margin-bottom:20px"><div class="av" style="width:84px;height:84px;font-size:34px;margin:0 auto 10px">M</div><b style="font:800 22px 'Bricolage Grotesque'">Mei Studio</b><div class="mut">★ 4.8 · 36 reviews</div></div>
${[['Payout account','hacct'],['View public profile','hostpub'],['Edit host info','']].map(([x,g])=>`<div class="card row" ${g?`data-go="${g}"`:''} style="margin-bottom:8px;cursor:pointer"><span class="sp">${x}</span><span class="mut">›</span></div>`).join('')}
<div class="card row" data-go="home" style="margin-top:14px;cursor:pointer;background:var(--acc);color:var(--accink)"><div class="sp"><b>Switch to Attendee mode</b></div><b>→</b></div></div>`}};

/* modals */
const M={
 signin:()=>{const W={join:['Sign in to join','Free or paid, we need to know who is coming. Browsing stays open.'],save:['Sign in to save','Saved events live in your account, so they follow you across phones.'],chat:['Sign in to chat','Chat is between you and the host, so we need to know who you are.']}[st.why]||['Sign in','Browsing stays open.'];return `<div class="gr"></div><h3>${W[0]}</h3><p class="mut" style="margin:4px 0 16px">${W[1]}</p><button class="btn pri" data-signin style="margin-bottom:10px">Continue with Google</button><button class="btn sec" data-signin>Continue with phone number</button>`},
 complete:()=>`<div class="gr"></div><h3>Mark as completed?</h3><p class="mut" style="margin:4px 0 16px">Guests can leave reviews and your payout is scheduled for 3 working days later. 7 guests didn't check in. If you do nothing, the event completes by itself 24 hours after it ends.</p><button class="btn pri" data-go="hevents" data-close style="margin-bottom:10px">Yes, mark completed</button><button class="btn sec" data-close>Not yet</button>`,
 delete:()=>`<div class="gr"></div><h3>Delete this event?</h3><p class="mut" style="margin:4px 0 16px">12 guests have paid RM360 in total. All of them are refunded in full and told the event was cancelled. This can't be undone.</p><button class="btn dng" data-go="hevents" data-close style="margin-bottom:10px">Yes, delete and refund</button><button class="btn sec" data-close>Keep event</button>`, cancel:()=>`<div class="gr"></div><h3>Cancel this booking?</h3><p class="mut" style="margin:4px 0 16px">You're within the free cancellation window. RM30 goes back to your original payment method in 3–7 working days.</p><button class="btn pri" data-go="bookings" data-close style="margin-bottom:10px">Yes, cancel</button><button class="btn sec" data-close>Keep booking</button>`,
 area:()=>`<div class="gr"></div><h3>Where to?</h3><div class="chips" style="margin:14px 0">${['Bangsar','KLCC','PJ','Sri Hartamas','Mid Valley','Bukit Bintang'].map(a=>`<span class="chip ${st.area===a?'on':''}" data-area="${a}">${a}</span>`).join('')}</div><div class="mut" style="margin-bottom:6px">Within</div><div class="chips" style="margin-bottom:18px"><span class="chip">2 km</span><span class="chip on">5 km</span><span class="chip">10 km</span></div><button class="btn pri" data-close>Show events</button>`
};

/* ---------------- engine ---------------- */
const NAMES={home:'Discover',detail:'Event (bookable)',info:'Event (free)',checkout:'Checkout',gw:'Gateway page',processing:'Confirming payment',failed:'Payment failed',confirmed:'Ticket',bookings:'Bookings',saved:'Saved',review:'Review',hostpub:'Host profile (public)',chats:'Chat',chat:'Chat thread',hchats:'Host · Chat',hchat:'Host · Chat thread',profile:'Profile',hdash:'Host · Home',hevents:'Host · Events',hcreate:'Host · New event',notifs:'Notifications',hevent:'Host · Event details',hedit:'Host · Edit event',hscan:'Host · Scan tickets',hbook:'Host · Guest list',hcheck:'Host · Check-in',hpay:'Host · Payouts',hacct:'Host · Payout account',hprofile:'Host · Profile'};
$('jump').innerHTML=`<optgroup label="Attendee">${['home','detail','info','checkout','gw','processing','failed','confirmed','bookings','saved','chats','chat','notifs','review','hostpub','profile'].map(k=>`<option value="${k}">${NAMES[k]}</option>`).join('')}</optgroup><optgroup label="Host">${['hdash','hevents','hevent','hcreate','hedit','hscan','hbook','hcheck','hpay','hchats','hchat','hacct','hprofile'].map(k=>`<option value="${k}">${NAMES[k]}</option>`).join('')}</optgroup>`;
function render(){
  REG.length=0;
  const s=S[st.screen];
  $('ph').dataset.t={now:'now',night:'late',weekend:'sat'}[st.t]||st.t;$('ph').classList.toggle('home',!!s.home);
  $('screen').innerHTML=s.html();if(s.home)syncScroll();
  const T=s.tab==='att'?ATT:s.tab==='host'?HOST:null;
  $('tabs').innerHTML=T?`<div class="tabs">${T.map(([g,l,i])=>`<div class="${g===st.screen?'on':''}" data-go="${g}">${i}${l}${g==='chats'?'<u class="bdg">1</u>':g==='hchats'?'<u class="bdg">2</u>':''}</div>`).join('')}</div>`:'';
  $('modal').innerHTML=st.modal?`<div class="scrim" data-scrim><div class="msheet">${M[st.modal]()}</div></div>`:'';
  $('jump').value=st.screen;
}
function go(id){if(id!==st.screen){st.hist.push(st.screen);st.screen=id}st.modal=null;render()}
function toggleSet(k){st.saved.has(k)?st.saved.delete(k):st.saved.add(k)}
function needAuth(why,after){if(st.signed)return after();st.why=why;st.after=after;st.modal='signin';render()}
function heart(q,k){toggleSet(k);const on=st.saved.has(k);q.classList.toggle('on',on);if(q.matches('.rb'))q.textContent=on?'♥':'♡'}
document.addEventListener('click',x=>{
  const t=x.target;let q;
  if(!t.closest('.phone'))return;
  if(q=t.closest('[data-signin]')){st.signed=true;st.modal=null;const a=st.after;st.after=null;if(a){a();return render()}return go('checkout')}
  if(q=t.closest('[data-join]'))return needAuth('join',()=>go('checkout'));
  if(q=t.closest('[data-chat]'))return needAuth('chat',()=>go('chat'));
  if(q=t.closest('[data-hev]')){st.hev=+q.dataset.hev;return go('hevent')}
  if(q=t.closest('[data-cap]')){st.cap=Math.max(12,Math.min(40,st.cap+ +q.dataset.cap));return render()}
  if(q=t.closest('[data-scan]')){st.scanned++;return render()}
  if(q=t.closest('[data-pick]')){q.parentElement.querySelectorAll('[data-pick]').forEach(c=>c.classList.remove('on'));q.classList.add('on');return}
  if(q=t.closest('[data-area]')){st.area=q.dataset.area;return render()}
  if(q=t.closest('[data-modal]')){st.modal=q.dataset.modal;return render()}
  if(q=t.closest('[data-close]')){const g=q.dataset.go;st.modal=null;if(g)return go(g);return render()}
  if(t.closest('[data-scrim]')&&!t.closest('.msheet')){st.modal=null;return render()}
  if(q=t.closest('[data-back]')){st.modal=null;if(st.hist.length)st.screen=st.hist.pop();return render()}
  if(q=t.closest('[data-zoom]')){st.zoom=q.dataset.zoom;st.sel=-1;return render()}
  if(q=t.closest('[data-unzoom]')){st.zoom=null;st.sel=-1;return render()}
  if(q=t.closest('[data-acat]')){st.acat=q.dataset.acat;return render()}
  if(q=t.closest('[data-allclose]')){st.all=false;return render()}
  if(q=t.closest('[data-i]')){const k=KEYS[+q.dataset.i];if(k==='all'){st.all=true;st.acat='all';return render()}st.t=k;st.sel=0;return render()}
  if(q=t.closest('[data-h]')){const k=q.dataset.h;return needAuth('save',()=>heart(q,k))}
  if(q=t.closest('[data-fav]')){const k=st.ev.t;return needAuth('save',()=>heart(q,k))}
  if((q=t.closest('.dc'))&&!q.classList.contains('mid')){const c=q.parentElement;c.scrollTo({left:[...c.children].indexOf(q)*(+c.dataset.w||208),behavior:'smooth'});return}
  if(q=t.closest('[data-reg]')){ev(REG[+q.dataset.reg]);return}
  if(q=t.closest('[data-n]')){const id=+q.dataset.n,k=SCX.findIndex(e=>e.i===id),c=document.querySelector('.scx');if(k<0||!c)return;st.sel=id;document.querySelectorAll('.node[data-n]').forEach(nd=>nd.classList.toggle('sel',+nd.dataset.n===id));c.querySelectorAll('.dc').forEach((d,i)=>d.classList.toggle('mid',i===k));dockLock=true;clearTimeout(dockLockT);dockLockT=setTimeout(()=>dockLock=false,800);c.scrollTo({left:k*(+c.dataset.w||208),behavior:'smooth'});return}
  if(q=t.closest('[data-ev]')){const e=all()[+q.dataset.ev];if(e)ev(e);return}
  if(q=t.closest('[data-act]')){st.people=Math.max(1,Math.min(2,st.people+(q.dataset.act==='pp'?1:-1)));return render()}
  if(q=t.closest('[data-method]')){st.method=+q.dataset.method;return render()}
  if(q=t.closest('[data-seg]')){st.bk=+q.dataset.seg;return render()}
  if(q=t.closest('[data-star]')){st.rating=+q.dataset.star;return render()}
  if(q=t.closest('[data-switch]')){q.closest('.swwrap').classList.toggle('on');return}
  if(q=t.closest('[data-chk]')){q.classList.toggle('on');return}
  if(q=t.closest('[data-go]')){return go(q.dataset.go)}
});
let scTm=null,dockLock=false,dockLockT=null;
document.addEventListener('scroll',x=>{const c=x.target;if(!c||!c.classList||!c.classList.contains('scx'))return;if(dockLock)return;const k=Math.max(0,Math.min(SCX.length-1,Math.round(c.scrollLeft/(+c.dataset.w||208)))),e=SCX[k];if(!e)return;c.querySelectorAll('.dc').forEach((d,i)=>d.classList.toggle('mid',i===k));if(e.i===st.sel)return;st.sel=e.i;document.querySelectorAll('.node[data-n]').forEach(nd=>nd.classList.toggle('sel',+nd.dataset.n===st.sel))},true);
$('jump').addEventListener('change',e=>{st.hist=[];st.modal=null;st.screen=e.target.value;st.ev=st.screen==='info'?DATA.sat.ev[1]:PIL;render()});
setInterval(()=>{[...DATA.now.ev,...DATA.night.ev].forEach(e=>{if(e.sec>0)e.sec--});if(!st.all)return;DATA.all.ev.forEach((e,i)=>{if(e.sec>0)document.querySelectorAll(`[data-cd="${i}"]`).forEach(el=>el.textContent=cd(e.sec))})},1000);

/* ---------------- background styles ---------------- */
const BGS=[['sky','Sky gradient (current)'],['pastel','Pastel mesh'],['aurora','Aurora glow'],['contour','Contour map'],['skyline','KL skyline'],['grain','Film grain'],['gpastel','Grain + Pastel'],['gaurora','Grain + Aurora'],['gpaper','Grain + Paper'],['gduo','Grain + Riso duotone'],['blobs','Flat blobs'],['doodle','Emoji doodle']];
const BGH={
 gaurora:()=>BGH.aurora(),
 gduo:()=>`<svg viewBox="0 0 390 844" width="390" height="844" style="mix-blend-mode:multiply"><circle cx="320" cy="150" r="170" fill="#ff7a6b" opacity=".75"/><circle cx="60" cy="560" r="190" fill="#5a7bff" opacity=".6"/><circle cx="260" cy="430" r="110" fill="#ffd166" opacity=".8"/></svg>`,
 aurora:()=>'<i class="ab a1"></i><i class="ab a2"></i><i class="ab a3"></i><i class="ab a4"></i>',
 contour:()=>{const cx=175,cy=455;let d='';for(let k=0;k<17;k++){const R=22+k*23,pt=[];for(let a=0;a<=360;a+=6){const t=a*Math.PI/180,w=1+.13*Math.sin(t*3+k*.7)+.08*Math.sin(t*5-k*.4)+.05*Math.sin(t*2+k);pt.push((cx+Math.cos(t)*R*w*1.3).toFixed(1)+' '+(cy+Math.sin(t)*R*w).toFixed(1))}d+=`<path d="M${pt.join('L')}Z"/>`}return `<svg viewBox="0 0 390 844" width="390" height="844"><g fill="none" stroke="currentColor" stroke-width="1" opacity=".2">${d}</g></svg>`},
 skyline:()=>{const r=rng(5),B=760;let far='',mid='',near='',win='',x=-10;
  while(x<400){const w=14+r()*22,h=70+r()*90;far+=`<rect x="${x|0}" y="${B-h|0}" width="${w|0}" height="${h|0}"/>`;x+=w+2}
  x=-8;while(x<400){const w=16+r()*26,h=40+r()*80;if((x>35&&x<92)||(x>200&&x<275)){x+=w+3;continue}mid+=`<rect x="${x|0}" y="${B-h|0}" width="${w|0}" height="${h|0}"/>`;x+=w+3}
  x=-6;while(x<400){const w=18+r()*30,h=24+r()*52;near+=`<rect x="${x|0}" y="${B-h|0}" width="${w|0}" height="${h|0}"/>`;for(let k=0;k<4;k++)if(r()<.6)win+=`<rect x="${(x+3+r()*(w-8))|0}" y="${(B-h+4+r()*(h-10))|0}" width="2.5" height="3.5"/>`;x+=w+4}
  const pet=x0=>`<polygon points="${x0},${B} ${x0},650 ${x0+3},620 ${x0+3},595 ${x0+6},570 ${x0+6},548 ${x0+11},515 ${x0+16},548 ${x0+16},570 ${x0+19},595 ${x0+19},620 ${x0+22},650 ${x0+22},${B}"/><rect x="${x0+10}" y="478" width="2" height="38"/>`;
  const tw=pet(214)+pet(244)+'<rect x="236" y="652" width="8" height="3"/><polygon points="59,760 67,760 65,602 61,602"/><ellipse cx="63" cy="591" rx="12" ry="7"/><ellipse cx="63" cy="575" rx="7" ry="4"/><rect x="62.2" y="500" width="1.6" height="75"/>';
  return `<svg viewBox="0 0 390 844" width="390" height="844" style="color:color-mix(in srgb,var(--p3) 55%,#0a0a1f)"><g fill="currentColor"><g opacity=".2">${far}</g><g opacity=".36">${mid}</g><g opacity=".6">${tw}</g><g opacity=".78">${near}<rect x="0" y="${B}" width="390" height="90"/></g></g><g fill="#ffe9a8" opacity=".55">${win}</g></svg>`},
 blobs:()=>`<svg viewBox="0 0 390 844" width="390" height="844"><defs><pattern id="dt" width="14" height="14" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="rgba(43,33,64,.14)"/></pattern></defs><rect width="390" height="844" fill="url(#dt)"/><circle cx="350" cy="70" r="115" style="fill:var(--p2)" opacity=".85"/><circle cx="8" cy="430" r="150" style="fill:var(--p1)" opacity=".8"/><path d="M190 620q100-70 200 10v214H190z" style="fill:var(--p4)" opacity=".9"/><circle cx="305" cy="335" r="44" fill="none" style="stroke:var(--p3)" stroke-width="10"/><rect x="44" y="190" width="66" height="66" rx="18" style="fill:var(--p3)" opacity=".7" transform="rotate(18 77 223)"/><path d="M34 650q15-24 30 0t30 0t30 0" fill="none" stroke="#2b2140" stroke-width="5" stroke-linecap="round" opacity=".55"/></svg>`,
 doodle:()=>{const E=[['🎨',14,38,-14],['🏃',88,26,10],['🎴',50,84,-6],['🧘',118,96,16],['🎲',18,132,12],['☕',92,140,-10]];return `<svg viewBox="0 0 390 844" width="390" height="844"><defs><pattern id="dd" width="150" height="150" patternUnits="userSpaceOnUse" patternTransform="rotate(-8)">${E.map(([g,x,y,r])=>`<text x="${x}" y="${y}" font-size="26" transform="rotate(${r} ${x} ${y})">${g}</text>`).join('')}</pattern></defs><rect width="390" height="844" fill="url(#dd)" opacity=".2"/></svg>`}
};
function setBg(v){st.bg=v;const ph=$('ph');BGS.forEach(m=>ph.classList.toggle('bg-'+m[0],m[0]===v));$('bgx').innerHTML=BGH[v]?BGH[v]():''}
const VWS=[['path','☀️ Sun path (arc by time)'],['spiral','🌀 Time spiral'],['orbit','🪐 Orbit rings (by time)'],['bloom','🌸 Bloom (petal per category)'],['hive','🐝 Hive (category honeycomb)'],['stream','🌊 Time stream ribbon'],['gridtime','📅 Grid (time × area)'],['area','🗺 Area constellation'],['drift','☁️ Drift nebula (by score)'],['star','✨ Constellation'],['bub','🫧 Bubbles (bigger = closer)'],['map','📍 Street map pins'],['pol','📌 Polaroid pinboard'],['wave','〰️ River wave'],['hex','⬡ Honeycomb'],['radar','📡 Radar (old)']];

function fit(){const s=Math.min(1,(innerHeight-130)/844,(innerWidth-20)/390),w=$('wrap');w.style.width=390*s+'px';w.style.height=844*s+'px';$('ph').style.transform=`scale(${s})`;SC=s}
addEventListener('resize',fit);fit();render();setBg('grain');
</script>
