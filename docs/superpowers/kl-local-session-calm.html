<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KL Local Session · Calm</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FAF8F5;--surface:#fff;--ink:#1B2430;--mut:#5F6B7A;--faint:#8A94A1;--line:#E7E2DA;
  --acc:#1F5E5B;--acc-soft:#E3EFEC;--ok:#1E7A4F;--ok-soft:#E4F1E9;--bad:#B3261E;--bad-soft:#FBE9E7;--warn:#9A6200;--warn-soft:#FBF0D9;
  --serif:Fraunces,Georgia,serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#ECE8E1;color:var(--ink);font:15px/1.45 Inter,-apple-system,system-ui,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:12px 10px}
.cap{display:flex;gap:10px;align-items:center;margin-bottom:10px;font-size:12px;color:var(--mut);flex-wrap:wrap;justify-content:center}
.cap b{color:var(--ink);font-size:15px;font-weight:600}
.cap select{background:#fff;color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:6px 8px;font:inherit}
#wrap{position:relative}
.phone{width:390px;height:844px;border-radius:44px;position:absolute;left:0;top:0;transform-origin:0 0;overflow:hidden;background:var(--bg);box-shadow:0 0 0 8px #1B2430,0 24px 60px rgba(27,36,48,.25)}
.status{position:absolute;top:0;left:0;right:0;height:44px;padding:16px 28px 0;display:flex;justify-content:space-between;font-size:12px;font-weight:600;z-index:40;pointer-events:none}
.status{background:linear-gradient(var(--bg) 62%,rgba(250,248,245,0))}
.status.clear{background:none}
.status.light{color:#fff;background:linear-gradient(#0E1217 62%,rgba(14,18,23,0))}
#screen{position:absolute;inset:0}
svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
[data-go],[data-act],[data-modal],[data-back],[data-ev],[data-cat],[data-seg],[data-sw],[data-pick],[data-chk],[data-fav],[data-send]{cursor:pointer}

/* layout */
.scroll{position:absolute;inset:0;overflow:auto;scrollbar-width:none;padding:56px 20px 110px}
.scroll::-webkit-scrollbar{display:none}
.scroll.tabbed{padding-bottom:120px}
.scroll.nopad{padding:0 0 110px}
.nav{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.nav b{flex:1;font-weight:600;font-size:17px;text-align:center}
.nav .sp0{width:40px;flex:none}
.ib{width:40px;height:40px;border-radius:12px;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;flex:none;position:relative;color:var(--ink)}
.ib.gl{background:rgba(255,255,255,.92);border-color:transparent}
.bdg{position:absolute;top:-5px;right:-5px;min-width:17px;height:17px;border-radius:9px;background:#C9432F;color:#fff;font:600 10px/17px Inter;text-align:center;padding:0 4px;border:2px solid var(--bg);box-sizing:content-box}
h1{font:500 32px/1.1 var(--serif);letter-spacing:-.015em;margin:6px 0 16px}
h2{font:600 18px/1.2 var(--serif);margin:0}
h3{font:600 20px/1.2 var(--serif);margin:0 0 6px}
p{margin:0 0 10px;color:#35404E}
.mut{color:var(--mut);font-size:13px}
.eye{font-size:11.5px;font-weight:600;letter-spacing:.1em;color:var(--faint);text-transform:uppercase}
.center{text-align:center}
.ok{color:var(--ok);font-weight:500}
.sech{display:flex;justify-content:space-between;align-items:baseline;margin:0 0 12px}
.more{font-size:13px;font-weight:600;color:var(--acc)}
.row{display:flex;gap:12px;align-items:center}
.row .sp{flex:1;min-width:0}
.vf{width:14px;height:14px;stroke:var(--acc);stroke-width:2.2;flex:none}
.host{display:flex;align-items:center;gap:4px;font-size:13px;color:var(--mut);min-width:0}
.host span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* art */
[data-art]{position:relative;overflow:hidden}
[data-art]>svg.bg{position:absolute;inset:0;width:100%;height:100%;stroke:none;fill:initial}

/* buttons / fields */
.btn{height:50px;border-radius:12px;border:0;font:600 16px Inter;display:flex;align-items:center;justify-content:center;gap:8px;width:100%;background:var(--acc);color:#fff}
.btn.sec{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.dng{background:var(--bad);color:#fff}
.btn.sm{height:38px;width:auto;padding:0 14px;font-size:13.5px;border-radius:10px}
.btn.link{background:none;color:var(--acc);height:40px}
.btn.dlk{background:none;color:var(--bad);font-weight:500;height:44px}
.cta{position:absolute;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:14px 20px 30px;display:flex;align-items:center;gap:12px;z-index:20}
.cta.stack{flex-direction:column}
.cta.above{bottom:84px;padding-bottom:14px}
.cta .tot small{display:block;color:var(--mut);font-size:12px;white-space:nowrap}.cta .tot b{font-size:18px;font-weight:600;white-space:nowrap}
.fld{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:10px}
.fld label{display:block;font-size:11.5px;font-weight:600;color:var(--faint);margin-bottom:2px}
.fld input,.fld textarea{width:100%;border:0;outline:0;background:none;font:500 15px Inter;color:var(--ink);padding:0;resize:none}
.fld.lock{background:#F4F1EC}
.chip{height:34px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:13px;font-weight:500;display:inline-flex;align-items:center;white-space:nowrap}
.chip.on{background:var(--acc-soft);border-color:var(--acc);color:var(--acc)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.seg{display:flex;background:#F0EDE8;border-radius:12px;padding:3px;margin-bottom:16px}
.seg span{flex:1;text-align:center;padding:9px 0;font-size:14px;font-weight:500;color:var(--mut);border-radius:10px}
.seg span.on{background:#fff;color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(27,36,48,.12)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px}
.card.tint{background:var(--acc-soft);border-color:transparent}
.soft{background:#F4F1EC;border-radius:12px;padding:12px 14px;font-size:13px;color:var(--mut);margin-bottom:12px}
.st{display:inline-flex;font-size:11.5px;font-weight:600;border-radius:8px;padding:3px 8px;background:#F0EDE8;color:var(--mut);white-space:nowrap}
.st.ok{background:var(--ok-soft);color:var(--ok)}.st.warn{background:var(--warn-soft);color:var(--warn)}.st.bad{background:var(--bad-soft);color:var(--bad)}.st.acc{background:var(--acc-soft);color:var(--acc)}
.av{width:44px;height:44px;border-radius:50%;background:var(--acc-soft);color:var(--acc);display:grid;place-items:center;font-weight:600;flex:none}
.stack i svg{width:14px;height:14px;stroke:#fff}
.stack{display:flex}.stack i{width:28px;height:28px;border-radius:50%;border:2px solid #fff;margin-left:-8px;display:grid;place-items:center;font-style:normal;font-size:11px;font-weight:600;color:#fff}.stack i:first-child{margin-left:0}
.sw{width:46px;height:28px;border-radius:14px;background:#D8D3CA;position:relative;flex:none;transition:.2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.on>.sw,.sw.on{background:var(--acc)}.on>.sw::after,.sw.on::after{left:21px}
.chk{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;color:transparent;flex:none}
.chk.on{background:var(--ok);border-color:var(--ok);color:#fff}
.chk svg{width:16px;height:16px;stroke-width:2.5}
.policy{display:flex;gap:12px;background:var(--ok-soft);border-radius:14px;padding:13px 14px;margin-bottom:16px;color:var(--ok)}
.policy b{display:block;font-weight:600;font-size:14px}.policy span{font-size:13px;color:#2F5C45}
.policy.neutral{background:#F4F1EC;color:var(--mut)}.policy.neutral span{color:var(--mut)}
.bar{height:6px;border-radius:3px;background:#EAE5DC;overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:var(--acc);border-radius:3px}

/* tab bar */
.tabs{position:absolute;left:0;right:0;bottom:0;height:84px;background:var(--surface);border-top:1px solid var(--line);display:flex;padding:8px 8px 24px;z-index:30}
.tabs div{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:500;color:var(--faint);padding-top:4px;position:relative}
.tabs div.on{color:var(--acc)}
.tabs .bdg{top:0;left:calc(50% + 4px);right:auto;border-color:var(--surface)}

/* modal + toast */
.scrim{position:absolute;inset:0;background:rgba(27,36,48,.45);z-index:60;display:flex;align-items:flex-end;animation:fade .2s}
.msheet{background:var(--bg);width:100%;border-radius:24px 24px 0 0;padding:12px 20px 32px;animation:rise .28s cubic-bezier(.2,.8,.2,1)}
.msheet .gr{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 16px}
@keyframes fade{from{opacity:0}}@keyframes rise{from{transform:translateY(30px);opacity:0}}
.toast{position:absolute;left:20px;right:20px;bottom:110px;z-index:70;background:var(--ink);color:#fff;border-radius:12px;padding:12px 14px;font-size:13.5px;text-align:center;animation:fade .2s}

/* home */
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.loc{display:inline-flex;gap:6px;align-items:center;font-weight:500;font-size:14px}
.search{display:flex;gap:10px;margin-bottom:18px}
.sb{flex:1;height:44px;border-radius:12px;background:var(--surface);border:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:0 14px;color:var(--faint)}
.sb input{flex:1;border:0;outline:0;background:none;font:400 14px Inter;color:var(--ink);min-width:0}
.cats{display:flex;justify-content:space-between;margin-bottom:26px}
.cat{width:76px;text-align:center;font-size:12.5px;font-weight:500}
.cat .art{width:64px;height:64px;border-radius:18px;margin:0 auto 7px;border:2px solid var(--line)}
.cat.on .art{border-color:var(--acc)}.cat.on{color:var(--acc);font-weight:600}
.car{display:flex;gap:12px;overflow-x:auto;margin:0 -20px 26px;padding:0 20px 4px;scroll-snap-type:x mandatory;scroll-padding-left:20px;scrollbar-width:none}
.car::-webkit-scrollbar{display:none}
.cc{flex:none;width:262px;scroll-snap-align:start;background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.cc .art{height:136px}
.cc .bd{padding:12px 14px 14px}
.cc h4{font:600 17px/1.2 var(--serif);margin:0 0 3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cc .ft{display:flex;justify-content:space-between;align-items:center;margin-top:12px;padding-top:11px;border-top:1px solid var(--line);font-size:12.5px;color:var(--mut)}
.cc .ft b{color:var(--ink);font-weight:600;font-size:14px}
.cc .stack i{width:24px;height:24px;font-size:10px;margin-left:-7px}.cc .stack i:first-child{margin-left:0}
.badge{position:absolute;left:12px;top:12px;z-index:2;background:rgba(255,255,255,.94);border-radius:8px;padding:5px 9px;font-size:12px;font-weight:600;color:var(--ink);display:flex;align-items:center;gap:6px}
.badge.live{color:var(--ok)}.badge i{width:7px;height:7px;border-radius:50%;background:var(--ok)}
.heart{position:absolute;right:10px;top:10px;z-index:2;width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.94);display:grid;place-items:center;color:var(--ink)}
.heart svg{width:16px;height:16px}.heart.on{color:#C9432F}.heart.on svg{fill:#C9432F}
.lr{display:flex;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px;margin-bottom:10px}
.lr .art{width:72px;height:72px;border-radius:12px;flex:none}
.lr .tx{min-width:0;flex:1;display:flex;flex-direction:column}
.lr .tx b{font-weight:600;font-size:14.5px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lr .ft{margin-top:auto;display:flex;justify-content:space-between;font-size:12.5px;color:var(--mut);padding-top:4px}
.lr .ft .p{color:var(--ink);font-weight:600}
.all{display:flex;align-items:center;justify-content:center;height:46px;border:1px solid var(--line);background:var(--surface);border-radius:12px;font-weight:600;font-size:14px;color:var(--acc);margin-top:4px}
.empty{text-align:center;color:var(--mut);padding:26px 0;font-size:14px}
.mapcard{position:relative;height:170px;border-radius:16px;overflow:hidden;border:1px solid var(--line);margin-bottom:26px}
.mapcard svg.m{width:100%;height:100%;stroke:none}
.mapcard .mb{position:absolute;left:10px;bottom:10px;background:#fff;border-radius:8px;padding:6px 10px;font-size:12.5px;font-weight:600}
.mapcard .mo{position:absolute;right:10px;bottom:10px;background:var(--acc);color:#fff;border-radius:8px;padding:6px 12px;font-size:12.5px;font-weight:600}

/* home boarding pass */
.tkrow{display:flex;align-items:flex-start;gap:12px;overflow-x:auto;margin:-2px -20px 20px;padding:0 20px;scroll-snap-type:x mandatory;scroll-padding-left:20px;scrollbar-width:none}
.tkrow::-webkit-scrollbar{display:none}
.tk{flex:none;width:310px;scroll-snap-align:start;color:#fff;cursor:pointer}
.tk-top,.tk-bot{background:var(--tkc);position:relative}
.tk-top{border-radius:20px 20px 0 0;padding:16px 20px 18px;
  -webkit-mask:radial-gradient(circle 11px at 0 100%,#0000 97%,#000) left/51% 100% no-repeat,radial-gradient(circle 11px at 100% 100%,#0000 97%,#000) right/51% 100% no-repeat;
  mask:radial-gradient(circle 11px at 0 100%,#0000 97%,#000) left/51% 100% no-repeat,radial-gradient(circle 11px at 100% 100%,#0000 97%,#000) right/51% 100% no-repeat}
.tk-top::after{content:"";position:absolute;left:24px;right:24px;bottom:0;border-bottom:2px dashed rgba(255,255,255,.45)}
.tk-bot{border-radius:0 0 20px 20px;padding:16px 20px 18px;
  -webkit-mask:radial-gradient(circle 11px at 0 0,#0000 97%,#000) left/51% 100% no-repeat,radial-gradient(circle 11px at 100% 0,#0000 97%,#000) right/51% 100% no-repeat;
  mask:radial-gradient(circle 11px at 0 0,#0000 97%,#000) left/51% 100% no-repeat,radial-gradient(circle 11px at 100% 0,#0000 97%,#000) right/51% 100% no-repeat}
.tk-r{display:flex;justify-content:space-between;align-items:center}
.tk-r small{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;opacity:.85}
.tk-r i{font-style:normal;font-size:11.5px;font-weight:600;background:rgba(255,255,255,.2);border-radius:8px;padding:3px 8px;white-space:nowrap}
.tk-t{font:500 21px/1.25 var(--serif);margin:12px 0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tk-h{font-size:13px;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tk-c{display:flex;justify-content:space-between}
.tk-c b{display:block;font-weight:600;font-size:17px}.tk-c span{display:block;font-size:12px;opacity:.75;margin-top:2px}
.tk-c .c{text-align:center}.tk-c .r{text-align:right}

/* full ticket */
.tcard{background:var(--surface);border:1px solid var(--line);border-radius:22px;box-shadow:0 8px 24px rgba(27,36,48,.07);margin-bottom:10px}
.tc-h{padding:18px 18px 26px;background:var(--tkc);color:#fff;border-radius:22px 22px 0 0;position:relative}
.tc-h::after{content:"";position:absolute;left:18px;right:18px;bottom:0;border-bottom:2px dashed rgba(255,255,255,.5)}
.tc-t{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:16px}
.tc-t b{font:500 21px/1.15 var(--serif);min-width:0}
.tc-t i{font-style:normal;font-size:11.5px;font-weight:600;color:#fff;background:rgba(255,255,255,.2);border-radius:8px;padding:4px 8px;white-space:nowrap}
.tc-t i.warn{color:var(--warn);background:var(--warn-soft)}
.tc-r{display:flex;justify-content:space-between;align-items:flex-start}
.tc-r b{display:block;font-weight:600;font-size:19px}.tc-r span{display:block;font-size:12.5px;color:rgba(255,255,255,.75);margin-top:2px}
.tc-r .rt{text-align:right}.tc-r .mid{text-align:center;padding-top:2px}.tc-r .mid>b{font-size:14px;margin-top:4px}
.ln{display:flex;align-items:center;gap:4px}.ln svg{width:20px;height:20px;color:#fff}.ln u{width:22px;border-top:2px dotted rgba(255,255,255,.55)}
.tc-cut{position:relative;height:0;margin:0 18px}
.tc-cut::before,.tc-cut::after{content:"";position:absolute;top:-14px;width:26px;height:26px;border-radius:50%;background:radial-gradient(circle,var(--tkc) 0 4.5px,transparent 5px),var(--bg);border:2px solid var(--tkc)}
.tc-cut::before{left:-31px}.tc-cut::after{right:-31px}
.tc-qr{padding:20px 18px 18px;text-align:center}
.tc-qr .qrs{width:150px;height:150px;fill:var(--ink);stroke:none}.tc-qr .mut{margin-top:6px}
.tc-g,.tc-row{display:flex;justify-content:space-between;padding:16px 0;margin:0 18px;border-top:1.5px dashed var(--line)}
.tc-g b,.tc-row b{display:block;font-weight:600;font-size:16px}.tc-g span,.tc-row span{display:block;font-size:12.5px;color:var(--faint);margin-top:2px}
.tc-g .r,.tc-row .r{text-align:right}
.tw{margin-bottom:30px}
.tact{display:flex;gap:10px}
.tb{flex:1;height:46px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:flex;align-items:center;justify-content:center;gap:8px;font-weight:600;font-size:14px;color:var(--ink);cursor:pointer;white-space:nowrap}
.tb svg{width:18px;height:18px;color:var(--acc)}
.tcancel{text-align:center;color:var(--faint);font-size:13px;text-decoration:underline;text-underline-offset:3px;padding:12px 8px 0;cursor:pointer}
.tcancel:hover{color:var(--bad)}
.grp{margin:8px 2px 10px}
.tlinks{display:flex;justify-content:center;gap:18px;margin-bottom:30px;font-size:13.5px;font-weight:600;color:var(--acc)}
.tlinks .d{color:var(--bad);font-weight:500}

/* detail */
.hero{height:260px}
.hero .ib{position:absolute;top:50px;z-index:3}
.sheet{position:relative;z-index:2;background:var(--bg);border-radius:24px 24px 0 0;margin-top:-24px;padding:22px 20px 0}
.tag{display:inline-flex;font-size:12px;font-weight:600;color:var(--acc);background:var(--acc-soft);border-radius:8px;padding:4px 9px;margin-bottom:10px}
.sheet h1{font-size:30px;margin:0 0 6px}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0}
.fc{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.fc small{display:block;color:var(--faint);font-size:11.5px;font-weight:500}.fc b{font-weight:600;font-size:14.5px}
.who{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:16px}
.who .stack i{width:34px;height:34px;font-size:12px}
.quote{border-left:3px solid var(--acc);padding:2px 0 2px 14px;margin:0 0 18px;font:500 17px/1.45 var(--serif)}
.quote small{display:block;font:500 12.5px Inter;color:var(--mut);margin-top:6px}
.hostcard{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:16px}
.hostcard b{font-weight:600;display:flex;gap:5px;align-items:center}

/* checkout */
.line{display:flex;justify-content:space-between;padding:7px 0;font-size:14px}
.line.t{border-top:1px solid var(--line);margin-top:6px;padding-top:12px;font-weight:600;font-size:16px}
.step{display:flex;align-items:center;gap:14px}
.step i{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);display:grid;place-items:center;font-style:normal;font-size:18px}
.pm{display:flex;gap:12px;align-items:center;padding:12px 0}.pm+.pm{border-top:1px solid var(--line)}
.rad{width:20px;height:20px;border-radius:50%;border:2px solid #C4C9D0;margin-left:auto;flex:none}.rad.on{border:6px solid var(--acc)}
.pmi{width:42px;height:28px;border-radius:6px;background:#F0EDE8;display:grid;place-items:center;font-size:10px;font-weight:600;color:var(--mut)}
.secure{display:flex;gap:8px;align-items:center;justify-content:center;font-size:12.5px;color:var(--mut);margin-top:4px}.secure svg{width:16px;height:16px}
.big-ic{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;margin:0 auto 16px}
.big-ic svg{width:34px;height:34px;stroke-width:2.2}

let toastT=null;
function toast(m){$('toastbox').innerHTML=`<div class="toast">${m}</div>`;clearTimeout(toastT);toastT=setTimeout(()=>$('toastbox').innerHTML='',1800)}
function render(){const s=S[st.screen];$('screen').innerHTML=s.html();
 const T=s.tab==='att'?ATT:s.tab==='host'?HOST:null;
 $('tabs').innerHTML=T?`<div class="tabs">${T.map(([g,l,ic])=>`<div class="${g===st.screen?'on':''}" data-go="${g}">${ic}${l}${g==='chats'&&st.notif.chat?'<span class="bdg">1</span>':''}${g==='hchats'?'<span class="bdg">2</span>':''}</div>`).join('')}</div>`:'';
 $('modal').innerHTML=st.modal?`<div class="scrim" data-scrim><div class="msheet">${M[st.modal]()}</div></div>`:'';
 $('status').className='status'+(s.dark?' light':s.hero?' clear':'');$('jump').value=st.screen;hydrate();
 if(st.screen==='chat'||st.screen==='hchat'){const t=$('thr');if(t)t.scrollTop=1e5}}
function go(id){if(id!==st.screen){if(ROOT.includes(id))st.hist=[];else st.hist.push(st.screen);st.screen=id}st.modal=null;render()}
function back(){st.modal=null;if(st.hist.length)st.screen=st.hist.pop();else st.screen=S[st.screen].tab==='host'||st.screen.startsWith('h')?'hdash':'home';render()}
function needAuth(why,after){if(st.signed)return after();st.why=why;st.after=after;st.modal='signin';render()}
function book(status){const e=EV[st.ev];let b=st.bookings.find(x=>x.ev===e.id);const tot=e.p*st.people;
 if(!b){b={id:'b'+Date.now(),ev:e.id,spots:st.people,code:'JOM-'+Math.random().toString(36).slice(2,6).toUpperCase()+'-48XD',paid:tot,pay:e.p?['FPX · Maybank','Card · Visa 2462','TnG eWallet','DuitNow QR'][st.method]:'Free',status};st.bookings.unshift(b)}else b.status=status;st.last=b}
function sendMsg(key){const i=$('msg');const v=i&&i.value.trim();if(!v)return;st.msgs[key].push(['me',v,'Now']);render();const f=$('msg');if(f)f.focus();
 if(key==='chat')setTimeout(()=>{if(st.screen!=='chat')return;st.msgs.chat.push(['them','Thanks! See you there 🙂','Now']);render()},900)}

document.addEventListener('click',x=>{const t=x.target;let q;if(!t.closest('.phone'))return;
 if(t.closest('[data-scrim]')&&!t.closest('.msheet')){st.modal=null;return render()}
 if(q=t.closest('[data-signin]')){st.signed=true;st.modal=null;const a=st.after;st.after=null;if(a){a();return render()}return render()}
 if(q=t.closest('[data-join]'))return needAuth('join',()=>go('checkout'));
 if(q=t.closest('[data-chat]'))return needAuth('chat',()=>go('chat'));
 if(q=t.closest('[data-fav]')){const id=+q.dataset.fav;return needAuth('save',()=>{st.saved.has(id)?st.saved.delete(id):st.saved.add(id);if(st.screen==='saved')return render();const on=st.saved.has(id);document.querySelectorAll(`[data-fav="${id}"]`).forEach(el=>el.classList.toggle('on',on))})}
 if(q=t.closest('[data-docancel]')){const i=st.bookings.findIndex(b=>b.id===st.pending);if(i>-1){const b=st.bookings.splice(i,1)[0],e=EV[b.ev];st.past.unshift({t:e.t,art:e.art,host:e.host,date:e.date,status:'cancelled'})}st.modal=null;render();return toast('Booking cancelled. Refund is on its way.')}
 if(q=t.closest('[data-modal]')){st.modal=q.dataset.modal;if(q.dataset.bk)st.pending=q.dataset.bk;return render()}
 if(q=t.closest('[data-close]')){const g=q.dataset.go;st.modal=null;if(g)return go(g);return render()}
 if(q=t.closest('[data-toast]')){toast(q.dataset.toast);if(q.hasAttribute('data-back'))return back();return}
 if(q=t.closest('[data-back]'))return back();
 if(q=t.closest('[data-area]')){st.area=q.dataset.area;return render()}
 if(q=t.closest('[data-pick]')){q.parentElement.querySelectorAll('[data-pick]').forEach(c=>c.classList.remove('on'));q.classList.add('on');return}
 if(q=t.closest('[data-cat]')){const k=q.dataset.cat;st.cat=st.cat===k?null:k;document.querySelectorAll('.cat').forEach(c=>c.classList.toggle('on',c.dataset.cat===st.cat));$('nearlist').innerHTML=nearHTML();hydrate();return}
 if(q=t.closest('[data-allfilter]')){st.allCat=q.dataset.allfilter||null;return render()}
 if(q=t.closest('[data-mapcat]')){st.mapCat=q.dataset.mapcat;return render()}
 if(q=t.closest('[data-pin]')){st.mapSel=+q.dataset.pin;return render()}
 if(q=t.closest('[data-ev]')){st.ev=+q.dataset.ev;return go('detail')}
 if(q=t.closest('[data-hev]')){st.hev=+q.dataset.hev;return go('hevent')}
 if(q=t.closest('[data-hseg]')){st.hseg=+q.dataset.hseg;return render()}
 if(q=t.closest('[data-seg]')){st.bk=+q.dataset.seg;return render()}
 if(q=t.closest('[data-star]')){st.rating=+q.dataset.star;return render()}
 if(q=t.closest('[data-submit-review]')){st.past[0].status='reviewed';toast('Thanks for your review');return go('bookings')}
 if(q=t.closest('[data-chk]')){q.classList.toggle('on');return}
 if(q=t.closest('[data-hchk]')){const i=+q.dataset.hchk;st.hchk[i][1]^=1;return render()}
 if(q=t.closest('[data-sw]')){const k=q.dataset.sw;if(k==='chat'||k==='review')st.notif[k]^=1;else{q.classList.toggle('on');q.querySelector('.sw').classList.toggle('on');return}return render()}
 if(q=t.closest('[data-act]')){const e=EV[st.ev],mx=Math.min(2,e.left!=null?e.left:2);st.people=Math.max(1,Math.min(mx,st.people+(q.dataset.act==='pp'?1:-1)));return render()}
 if(q=t.closest('[data-cap]')){st.cap=Math.max(8,Math.min(40,st.cap+ +q.dataset.cap));return render()}
 if(q=t.closest('[data-method]')){st.method=+q.dataset.method;return render()}
 if(q=t.closest('[data-checkout]')){const e=EV[st.ev];if(e.p)return go('gw');book('ok');return go('confirmed')}
 if(q=t.closest('[data-res]')){const r=q.dataset.res;if(r==='ok'){book('ok');return go('confirmed')}if(r==='fail')return go('failed');book('processing');go('bookings');return toast('Payment is still processing')}
 if(q=t.closest('[data-scan]')){st.scanned++;return render()}
 if(q=t.closest('[data-send]'))return sendMsg(q.dataset.send);
 if(q=t.closest('[data-signout]')){st.signed=!st.signed;render();return toast(st.signed?'Signed in':'Signed out')}
 if(q=t.closest('[data-go]')){if(q.hasAttribute('data-allcat'))st.allCat=q.dataset.allcat||null;return go(q.dataset.go)}
});
document.addEventListener('input',x=>{if(x.target.id==='q'){st.q=x.target.value;$('nearlist').innerHTML=nearHTML();hydrate()}});
document.addEventListener('keydown',x=>{if(x.key==='Enter'&&x.target.id==='msg')sendMsg(st.screen==='hchat'?'hchat':'chat')});
$('jump').addEventListener('change',e=>{st.hist=[];st.modal=null;st.screen=e.target.value;if(st.screen==='detail')st.ev=2;if(st.screen.startsWith('h'))st.hev=2;render()});
function fit(){const s=Math.min(1,(innerHeight-90)/844,(innerWidth-20)/390),w=$('wrap');w.style.width=390*s+'px';w.style.height=844*s+'px';$('ph').style.transform=`scale(${s})`;SC=s}
addEventListener('resize',fit);fit();if(location.hash&&S[location.hash.slice(1)])st.screen=location.hash.slice(1);if(st.screen.startsWith('h')&&st.screen!=='hostpub')st.hev=2;render();
</script>
</body>
</html>
